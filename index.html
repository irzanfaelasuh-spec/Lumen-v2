<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lumen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="logo">✦</span>Lumen</div>
    <button id="newChat" class="btn primary">＋ Chat baru</button>
    <div id="hist"></div>
    <button id="openPlug" class="btn ghost">🧩 Plugin</button>
    <button id="openSet" class="btn ghost">⚙ Pengaturan</button>
  </aside>
  <div id="scrim"></div>
  <main>
    <header>
      <button id="menu" class="icon" aria-label="Menu">☰</button>
      <span id="modelTag">Belum terhubung</span>
      <button id="theme" class="icon" aria-label="Tema">◐</button>
    </header>
    <div id="chat">
      <div id="welcome">
        <div class="orb"></div>
        <h1>Halo, ada yang bisa Lumen bantu?</h1>
        <div class="chips">
          <button>Jelaskan sesuatu dengan sederhana</button>
          <button>Bantu tulis email profesional</button>
          <button>Buatkan kode untuk saya</button>
          <button>Analisis gambar yang saya kirim</button>
        </div>
      </div>
      <div id="msgs"></div>
    </div>
    <footer>
      <div id="modes"><button data-m="chat">💬 Chat</button><button data-m="write">✍️ Tulis</button><button data-m="code">⌨️ Kode</button><button data-m="learn">🎓 Belajar</button></div>
      <div id="prev"></div>
      <div class="box">
        <button id="attach" class="icon" aria-label="Foto">📎</button>
        <textarea id="inp" rows="1" placeholder="Tanya apa saja, atau kirim foto…"></textarea>
        <button id="send" class="icon send" aria-label="Kirim">↑</button>
      </div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </footer>
  </main>
</div>

<div id="modal"><div class="card">
  <h2>Pengaturan</h2>
  <label>Gemini API key
    <input id="key" type="password" placeholder="AIza..." autocomplete="off">
  </label>
  <button id="conn" class="btn primary">Hubungkan &amp; cari model Flash</button>
  <small id="status">Dapatkan key gratis di aistudio.google.com/apikey</small>
  <label>Model <select id="model"></select></label>
  <label>Kepribadian (system prompt) <textarea id="sys" rows="3"></textarea></label>
  <label>Kreativitas: <b id="tv"></b> <input id="temp" type="range" min="0" max="1.5" step="0.1"></label>
  <button id="reload" class="btn ghost">↻ Muat ulang daftar model</button>
  <h3>Personalisasi</h3>
  <label>Nama panggilan kamu <input id="uname" placeholder="Misal: Budi"></label>
  <label>Warna aksen <div class="sw2" id="acc"></div></label>
  <label>Warna teks kode <div class="sw2" id="cols"></div></label>
  <label>Ukuran teks jawaban <input id="fs" type="range" min="14" max="22" step="1"></label>
  <h3>Perilaku</h3>
  <label class="chk"><input type="checkbox" id="enter"> Enter untuk kirim (di PC)</label>
  <label class="chk"><input type="checkbox" id="retry"> Auto-retry &amp; pindah model jika server sibuk</label>
  <button id="export" class="btn ghost">⬇ Ekspor chat ini (.md)</button>
  <div class="row">
    <button id="clear" class="btn ghost">Hapus semua chat</button>
    <button id="close" class="btn primary">Simpan</button>
  </div>
</div></div>
<div id="plugM"><div class="card">
  <h2>Plugin</h2>
  <small>Aktifkan kemampuan tambahan. Pilihanmu tersimpan.</small>
  <div id="plugList"></div>
  <button id="plugX" class="btn primary">Selesai</button>
</div></div>
<div id="toast"></div>
<script src="script.js"></script>
</body>
</html>
